name: macOS online installer (Apple silicon)

# Builds Lex Machina.app with the thin runtime payload, wraps it in the online
# .pkg, installs it on a clean macOS runner (the postinstall bootstrap downloads
# Node, Python, packages and models as the logged-in user), then runs the
# runtime self-test and /health from the installed app.

on:
  workflow_call:
    inputs:
      asset_name:
        type: string
        required: true
      offline:
        # The offline package: every component inside, the install needs no network.
        type: boolean
        required: false
        default: false
  push:
    branches:
      - "claude/modest-knuth-re40mu"
    paths:
      - ".github/workflows/macos-installer.yml"
      - "app/installer/build-macos-online.sh"
      - "app/installer/macos-online-bootstrap.sh"
      - "app/installer/generate-component-lock.py"
      - "app/installer/macos-release-source.json"
      - "app/installer/macos/**"
      - "app/lex-desktop/src-tauri/src/runtime_sidecar.rs"
      - "app/lex-desktop/src-tauri/tauri.macos.conf.json"
      - "app/lex-desktop/src-tauri/Cargo.toml"
      - "app/lex-desktop/src-tauri/build.rs"
  workflow_dispatch:
    inputs:
      offline:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  ASSET_NAME: ${{ inputs.asset_name || (inputs.offline && 'Lex-Machina-macOS-arm64-Offline-dryrun.pkg' || 'Lex-Machina-macOS-arm64-Online-dryrun.pkg') }}
  LEX_MACOS_OFFLINE: ${{ inputs.offline && '1' || '0' }}

jobs:
  build-and-accept:
    name: macOS ${{ inputs.offline && 'offline' || 'online' }} installer (Apple silicon) build and acceptance
    runs-on: macos-15
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build .app and .pkg
        env:
          LEX_GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.LEX_GOOGLE_OAUTH_CLIENT_JSON }}
        run: bash app/installer/build-macos-online.sh "$RUNNER_TEMP/$ASSET_NAME"

      - name: Install the .pkg (online bootstrap as the logged-in user)
        run: |
          set -euo pipefail
          status=0
          sudo installer -pkg "$RUNNER_TEMP/$ASSET_NAME" -target / -verboseR || status=$?
          tail -60 "$HOME/Library/Logs/LexMachina/install.log" || true
          [ "$status" -eq 0 ]
          grep -q BOOTSTRAP_PASS "$HOME/Library/Logs/LexMachina/install.log"
          if [ "$LEX_MACOS_OFFLINE" = 1 ]; then
            # Every component from the package: no download line, pip without an index.
            log="$HOME/Library/Logs/LexMachina/install.log"
            grep -q "OFFLINE_BUNDLE:" "$log"
            ! grep -q "^Downloading " "$log" || { echo "OFFLINE_INSTALL_DOWNLOADED" >&2; exit 1; }
            ! grep -q "Model prefetch via official source" "$log" || { echo "OFFLINE_INSTALL_PREFETCHED" >&2; exit 1; }
          fi

      - name: Runtime self-test and health from the installed app
        run: |
          set -euo pipefail
          runtime="/Applications/Lex Machina.app/Contents/Resources/runtime"
          "$runtime/lex-runtime-sidecar" --self-test
          log="$RUNNER_TEMP/runtime.log"
          token="ci-$RANDOM$RANDOM$RANDOM"
          LEX_HOST=127.0.0.1 LEX_PORT=0 LEX_DESKTOP_BOOTSTRAP_TOKEN="$token" \
            "$runtime/lex-runtime-sidecar" >"$log" 2>&1 &
          pid=$!
          address=""
          for _ in $(seq 1 90); do
            address="$(grep -Eo 'http://127\.0\.0\.1:[0-9]+' "$log" | head -1 || true)"
            [ -n "$address" ] && break
            sleep 1
          done
          [ -n "$address" ] || { cat "$log"; kill "$pid"; exit 1; }
          # The desktop-mode runtime answers only requests carrying the bootstrap token.
          curl -fsS -H "x-lex-desktop-bootstrap: $token" "$address/health"
          # First start: admin/admin exists and the status flags it until the password changes.
          status_json="$(curl -fsS -H "x-lex-desktop-bootstrap: $token" "$address/api/auth/status")"
          echo "$status_json"
          echo "$status_json" | grep -q '"temporaryAdminCredentialsActive":true' || { echo "ADMIN_NOTICE_FLAG_MISSING" >&2; kill "$pid"; exit 1; }
          curl -fsS -H "x-lex-desktop-bootstrap: $token" -H "Content-Type: application/json" \
            -d '{"loginName":"admin","password":"admin"}' "$address/api/auth/login" | grep -q sessionToken \
            || { echo "ADMIN_ADMIN_LOGIN_FAILED" >&2; kill "$pid"; exit 1; }
          kill "$pid"

      - name: Local model engine (llama.cpp Metal) from the release manifest
        run: |
          set -euo pipefail
          # The archive the app downloads for a local model: checksum, safe layout, the server runs.
          manifest="/Applications/Lex Machina.app/Contents/Resources/runtime/release-source.json"
          read -r url sha < <(python3 -c 'import json,sys; b=[x for x in json.load(open(sys.argv[1]))["runtime"]["llamaCpp"]["backends"] if x["id"]=="METAL_ARM64"][0]; print(b["url"], b["sha256"])' "$manifest")
          work="$RUNNER_TEMP/llama-metal"
          mkdir -p "$work/x"
          curl -fsSL -o "$work/engine.tar.gz" "$url"
          echo "$sha  $work/engine.tar.gz" | shasum -a 256 -c -
          if tar -tzf "$work/engine.tar.gz" | grep -E '^/|(^|/)\.\.(/|$)'; then echo "ENGINE_ARCHIVE_UNSAFE" >&2; exit 1; fi
          tar -xzf "$work/engine.tar.gz" -C "$work/x"
          server="$(find "$work/x" -type f -name llama-server | head -1)"
          [ -n "$server" ] || { echo "LLAMA_SERVER_MISSING" >&2; exit 1; }
          "$server" --version
          "$server" --list-devices || true

      - name: Transcription on the Apple GPU (MLX) is installed
        run: |
          set -euo pipefail
          py="$HOME/Library/Application Support/LexMachina/runtime/python/bin/python3"
          # The packages the worker uses on Apple Silicon; the GPU itself is measured on the user's Mac.
          "$py" -c 'import mlx.core as mx, mlx_whisper, importlib.metadata as m; print("mlx", m.version("mlx"), "mlx-whisper", m.version("mlx-whisper"), "metal", mx.metal.is_available())'

      - name: Launch the installed app (it must start its runtime)
        run: |
          set -euo pipefail
          open -a "/Applications/Lex Machina.app"
          started=0
          # On unix the sidecar execs node, so the runtime runs as node .../app/dist/http/server.js.
          runtime_pattern="Lex Machina.app/Contents/Resources/runtime/app/dist/http/server.js"
          for _ in $(seq 1 90); do
            if pgrep -f "$runtime_pattern" >/dev/null; then
              started=1
              break
            fi
            sleep 1
          done
          pgrep -fl "Lex Machina" || true
          # Fallback: end the app process only; "Lex Machina.app" also matches the runtime
          # (node .../Resources/runtime/...), which would hide an orphaned runtime below.
          osascript -e 'tell application "Lex Machina" to quit' || pkill -f "Lex Machina.app/Contents/MacOS/" || true
          [ "$started" = 1 ] || { echo "APP_DID_NOT_START_RUNTIME" >&2; exit 1; }
          # Quitting the app must not leave the runtime behind (TERM on exit, parent watchdog).
          for _ in $(seq 1 20); do
            pgrep -f "$runtime_pattern" >/dev/null || exit 0
            sleep 1
          done
          pgrep -fl "$runtime_pattern" || true
          echo "RUNTIME_ORPHANED_AFTER_QUIT" >&2
          exit 1

      - name: Receipt
        run: |
          mkdir -p mac-out
          cp "$RUNNER_TEMP/$ASSET_NAME" mac-out/
          printf 'sha256=%s\n' "$(shasum -a 256 "mac-out/$ASSET_NAME" | cut -d' ' -f1)" > mac-out/SHA256.txt
          cat mac-out/SHA256.txt

      - name: Upload accepted macOS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.offline && 'LexMachina-macOS-Offline-Installer' || 'LexMachina-macOS-Online-Installer' }}
          path: mac-out/
          retention-days: 14

