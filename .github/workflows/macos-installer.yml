name: macOS online installer (Apple silicon)

# Builds Lex Machina.app with the thin runtime payload, wraps it in the online
# .pkg, installs it on a clean macOS runner (the postinstall bootstrap downloads
# Node, Python, packages and models as the logged-in user), then runs the
# runtime self-test and /health from the installed app.

on:
  workflow_call:
    inputs:
      asset_name:
        type: string
        required: true
  push:
    branches:
      - "claude/modest-knuth-re40mu"
    paths:
      - ".github/workflows/macos-installer.yml"
      - "app/installer/build-macos-online.sh"
      - "app/installer/macos-online-bootstrap.sh"
      - "app/installer/generate-component-lock.py"
      - "app/installer/macos-release-source.json"
      - "app/installer/macos/**"
      - "app/lex-desktop/src-tauri/src/runtime_sidecar.rs"
      - "app/lex-desktop/src-tauri/tauri.macos.conf.json"
      - "app/lex-desktop/src-tauri/Cargo.toml"
      - "app/lex-desktop/src-tauri/build.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  ASSET_NAME: ${{ inputs.asset_name || 'Lex-Machina-macOS-arm64-Online-dryrun.pkg' }}

jobs:
  build-and-accept:
    name: macOS online installer (Apple silicon) build and acceptance
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Build .app and .pkg
        run: bash app/installer/build-macos-online.sh "$RUNNER_TEMP/$ASSET_NAME"

      - name: Install the .pkg (online bootstrap as the logged-in user)
        run: |
          set -euo pipefail
          status=0
          sudo installer -pkg "$RUNNER_TEMP/$ASSET_NAME" -target / -verboseR || status=$?
          tail -60 "$HOME/Library/Logs/LexMachina/install.log" || true
          [ "$status" -eq 0 ]
          grep -q BOOTSTRAP_PASS "$HOME/Library/Logs/LexMachina/install.log"

      - name: Runtime self-test and health from the installed app
        run: |
          set -euo pipefail
          runtime="/Applications/Lex Machina.app/Contents/Resources/runtime"
          "$runtime/lex-runtime-sidecar" --self-test
          log="$RUNNER_TEMP/runtime.log"
          token="ci-$RANDOM$RANDOM$RANDOM"
          LEX_HOST=127.0.0.1 LEX_PORT=0 LEX_DESKTOP_BOOTSTRAP_TOKEN="$token" \
            "$runtime/lex-runtime-sidecar" >"$log" 2>&1 &
          pid=$!
          address=""
          for _ in $(seq 1 90); do
            address="$(grep -Eo 'http://127\.0\.0\.1:[0-9]+' "$log" | head -1 || true)"
            [ -n "$address" ] && break
            sleep 1
          done
          [ -n "$address" ] || { cat "$log"; kill "$pid"; exit 1; }
          # The desktop-mode runtime answers only requests carrying the bootstrap token.
          curl -fsS -H "x-lex-desktop-bootstrap: $token" "$address/health"
          kill "$pid"

      - name: Receipt
        run: |
          mkdir -p mac-out
          cp "$RUNNER_TEMP/$ASSET_NAME" mac-out/
          printf 'sha256=%s\n' "$(shasum -a 256 "mac-out/$ASSET_NAME" | cut -d' ' -f1)" > mac-out/SHA256.txt
          cat mac-out/SHA256.txt

      - name: Upload accepted macOS installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexMachina-macOS-Online-Installer
          path: mac-out/
          retention-days: 14

