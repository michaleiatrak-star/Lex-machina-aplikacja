name: Publish Lex Machina 0.1.10 hotfix 37 online installer

# Builds, accepts and publishes the online installer in one run: runtime
# validation, the G33D online installer build and installed-copy acceptance,
# then the exact accepted artifact is attached to a pre-release at GITHUB_SHA.

on:
  push:
    branches:
      - "claude/jolly-bell-v4xata"
    paths:
      - ".github/workflows/publish-0.1.10-hotfix37.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lex-publish-0.1.10-hotfix37
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.10-hotfix37
  RELEASE_TITLE: Lex Machina v0.1.10 hotfix 37
  ASSET_NAME: Lex-Machina-0.1.10-hotfix37-Online-x64-Setup.exe

jobs:
  runtime:
    name: Runtime and Gate I audit
    uses: ./.github/workflows/lex-runtime.yml
    secrets: inherit

  online:
    name: Accepted online installer
    needs:
      - runtime
    uses: ./.github/workflows/lex-installer.yml
    secrets: inherit

  windows-account-shim:
    name: Windows account client launch (npm.cmd, path with a space)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/lex-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund

      # Each argument must reach the .cmd as one quoted argument.
      - name: npm.cmd and .cmd shims under "Lex Machina"
        run: npm run validate:windows-account-shim

  kio-live:
    name: KIO connector against the live UZP search
    runs-on: windows-latest
    timeout-minutes: 15
    # Official external service: an outage must not block the release, the
    # result is read before handing over the installer.
    continue-on-error: true
    defaults:
      run:
        working-directory: "Wersja rozwojowa rozpakowana/audyt-systemu-v4/mcp-servers"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install connector dependencies
        run: npm ci --no-audit --no-fund

      - name: KIO live cases
        env:
          LEX_TYLKO: "^KIO"
        run: node test_na_zywo.mjs

  publish:
    name: Publish accepted online installer
    needs:
      - runtime
      - online
      - windows-account-shim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download accepted online installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LexMachina-Windows-Online-Installer
          path: release-input/online

      - name: Verify receipt and assemble release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out

          online_exe="$(find release-input/online -type f -iname '*.exe' -print -quit)"
          online_receipt="$(find release-input/online -type f -name 'SHA256.txt' -print -quit)"
          for required in "$online_exe" "$online_receipt"; do
            [[ -n "$required" && -f "$required" ]] || {
              echo "RELEASE_ACCEPTED_ASSET_MISSING:$required" >&2
              exit 1
            }
          done

          expected="$(awk -F= '$1=="sha256"{print $2}' "$online_receipt" | tr -d '\r\n ')"
          actual="$(sha256sum "$online_exe" | awk '{print $1}')"
          [[ "$expected" == "$actual" ]] || {
            echo "ONLINE_RELEASE_HASH_MISMATCH expected=$expected actual=$actual" >&2
            exit 1
          }

          cp "$online_exe" "release-out/$ASSET_NAME"
          cp "$online_receipt" release-out/CI-SHA256-ONLINE.txt
          cp app/lex-version.yaml release-out/LEX-VERSION.yaml
          printf '%s\n' "$GITHUB_SHA" > release-out/SOURCE-SHA.txt
          (
            cd release-out
            sha256sum "$ASSET_NAME" LEX-VERSION.yaml > SHA256SUMS.txt
          )
          cat release-out/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-out/RELEASE-NOTES.md <<'EOF'
          ## Lex Machina 0.1.10 hotfix 37

          Instalator online dla Windows, zbudowany i przetestowany w przebiegu G33D (instalacja i uruchomienie zainstalowanej kopii) w tym samym przebiegu co publikacja.

          ### Błędny numer wersji i moduł z innego skilla
          - nazwa skilla lub modułu z innym numerem wersji (np. prawny-router-v2 zamiast v3) prowadzi od razu do istniejącego pliku, gdy pasuje dokładnie jeden;
          - moduł, którego nie ma we wskazanym skillu, jest szukany po dokładnej nazwie w pozostałych skillach.

          ### Z hotfix 36: Błędna nazwa modułu bez straconej rundy
          - gdy model poda ścieżkę modułu lub nazwę skilla z błędem (bez rozszerzenia, bez katalogu modules/, początek nazwy, skrót typu dr-02), aplikacja podaje jedyny pasujący plik w tej samej rundzie i zapisuje w audycie, o co prosił model;
          - przy kilku pasujących plikach model dostaje listę kandydatów zamiast zgadywać kolejne nazwy; słabe dopasowanie nigdy nie jest podawane automatycznie.

          ### Z hotfix 35: Metodyka doboru skilli dla wszystkich hostów
          - Claude z kontem (natywny korpus), ChatGPT, Gemini, Grok i klucze API dostają tę samą metodykę; różni się tylko narzędzie odczytu (Read albo read_legal_resource);
          - metodyka obejmuje kilka domen DR i kilka skilli wykonawczych naraz, a model ma sam dociągać moduły (modules/, shared/, references/) i dalsze skille, do których odsyłają wczytane SKILL.md, bez pytania użytkownika;
          - przy Claude z kontem prompt mówi wprost, że router i prawo-polskie-v2 są już wczytane.

          ### Z hotfix 34: Pytania prawne: router i prawo polskie od razu, metodyka doboru narzędzi
          - router prawny-router-v3 i fasada prawa polskiego prawo-polskie-v2 (wybór dziedziny DR-01–DR-16) są podawane modelowi z góry przy każdym modelu w trybie automatycznym — dotąd tylko przy Claude z kontem; przy ChatGPT, Gemini, Groku i kluczach API model musiał je najpierw sam wczytać, co kosztowało do dwóch rund (osobnych uruchomień modelu) przy każdym pytaniu prawnym; odczyt obu plików jest zapisany w audycie, a zasada „router v3 pierwszy” obowiązuje bez zmian;
          - metodyka doboru: domena DR i skill wykonawczy według routera; jeden odczyt to jeden plik — najpierw sam SKILL.md domeny, moduł w tej samej rundzie tylko przy znanej dokładnej nazwie, potem wyłącznie moduły potrzebne do zagadnienia razem z weryfikacją przepisów, które trafią do odpowiedzi; bez zgadywania nazw plików i przeglądania całych katalogów;
          - kwalifikator karnomaterialny jest dołączany wyłącznie przy skillu DR-03 (prawo karne, wykroczenia, KKS, wykonanie orzeczeń), nie w innych dziedzinach.

          ### Z hotfix 33: Krótsza ścieżka odpowiedzi prawnej (mniej rund modelu)
          - model, który przed routerem prawny-router-v3 poprosił o skill dziedzinowy albo moduł, dostawał odmowę i tracił całą rundę (przy logowaniu kontem to nowe uruchomienie klienta i kolejne zapytanie do limitu konta); teraz router jest dołączany do pierwszego odczytu (tak jak kwalifikator karny), a odczyt routera zlecony w tej samej rundzie wykonuje się jako pierwszy; zasada „router v3 pierwszy” obowiązuje bez zmian;
          - przy logowaniu kontem model dostaje polecenie, by nie powtarzał wyszukiwań i odczytów, które już ma, i weryfikował tylko przepisy, które poda w odpowiedzi.

          ### Z hotfix 32: Grok przez konto: „Rate limited” (PROVIDER_UNCODED_FAILURE)
          - klient Grok zgłasza przekroczenie limitu zapytań konta przez protokół ACP, a aplikacja przekazywała ten komunikat bez kodu; teraz to „limit zapytań lub dostępności konta” (ACCOUNT_SESSION_CAPACITY);
          - krótki limit zapytań jest ponawiany automatycznie po 15 s i po 45 s; wyczerpany limit planu (np. „usage limit”) nie jest ponawiany;
          - komunikat wyjaśnia, że pytanie prawne to kilka uruchomień modelu (odczyt skilli, weryfikacja przepisów), więc limit konta wyczerpuje się szybciej, i wskazuje: odczekać, wybrać inny model albo połączenie przez klucz API.

          ### Z hotfix 31: Konektory MCP: „NIEZGODNY z sumą kontrolną skilla”
          - przyczyna: instalator jest budowany na Windows, gdzie git przy pobraniu repozytorium zamieniał końce linii (LF na CRLF) w plikach skilli; pakiet serwerów lex-mcp.mjs w instalatorze miał przez to inne bajty niż suma w CHECKSUMS.sha256 skilla audyt-systemu-v4 (w repozytorium oba są zgodne);
          - pliki skilli trafiają do instalatora bez zmian końców linii, a budowa instalatora zatrzymuje się, gdy pakiet MCP nie zgadza się z sumą kontrolną skilla.

          ### Z hotfix 31: Przepisy (RAG): postęp OCR i akty bez tekstu w ELI
          - MRG Polska–Ukraina pokazywał stary błąd „PDF exceeds the configured page limit” także w trakcie pobierania, bo OCR 606 stron trwa długo, a status pokazywał tylko ostatni błąd; teraz przy akcie i w nagłówku sekcji widać postęp: pobieranie PDF, odczyt tekstu, „OCR skanu: 120/606 stron”;
          - przerwany OCR (zamknięcie aplikacji, błąd lokalnego OCR) wznawia się od pierwszej nieodczytanej strony, zamiast zaczynać od początku;
          - Konwencja wiedeńska (DU/1965/232) nie jest już „błędem pobierania”: ELI publikuje tylko skan pierwszej strony numeru Dz.U. z odesłaniem do załącznika, którego w ELI nie ma; akt trafia do osobnej listy „Bez tekstu w ELI” z wyjaśnieniem (sprawdzenie ELI raz na dobę); rozpoznanie adnotacji o załączniku jest odporne na błędy OCR (np. „ńumeru”).

          ### Z hotfix 31: Szybsze odpowiedzi przy logowaniu kontem (ChatGPT, Claude, Gemini, Grok)
          - każda runda narzędzi (odczyt routera, SKILL.md, modułu, weryfikacja przepisu) uruchamia przy koncie nowy proces klienta z całym kontekstem; model dostaje polecenie, by niezależne odczyty i weryfikacje zlecać w jednej rundzie, co zmniejsza liczbę uruchomień klienta.

          ### Z hotfix 31: Ustawienia → Użytkownicy: czytelniejsze uprawnienia do spraw
          - każda sprawa to zwijana karta: w nagłówku nazwa, właściciel i skład („1 osoba: Marcin (Edycja)”); po rozwinięciu przyciski „Zmień nazwę” i „Archiwizuj”, tabela „Osoby z dostępem” (osoba, rola, deanonimizacja, „Odbierz dostęp”) i formularz „Dodaj osobę do sprawy” z opisanymi polami;
          - opis ról: Właściciel (zarządzanie, klucz sprawy), Edycja (zmiany w aktach i analizy), Analiza (odczyt i analizy bez zmian w aktach), Podgląd (tylko odczyt).

          ### Z hotfix 31: Kalendarz
          - nagłówek dnia słownie („piątek, 2 października 2026”, „jutro”, „za 5 dni”);
          - w kratkach dni kolorowe znaczniki rodzajów zdarzeń (posiedzenie sądu, termin, spotkanie z klientem, inne) z legendą i podpowiedzią z listą zdarzeń;
          - nowa lista „Nadchodzące terminy” na 14 dni (terminy wyróżnione), kliknięcie przenosi do dnia;
          - w formularzu pole daty (wcześniej tylko zaznaczony dzień); przy zdarzeniu przycisk „Usuń” dla spraw z prawem zapisu.

          ### Z hotfix 30: Przepisy (RAG): akty, których PDF w ELI jest skanem albo ma ponad 600 stron
          - limit 600 stron dotyczył dokumentów sprawy, a kopia ELI dostała ten sam; tekst ogłoszony w Dz.U. bywa całym numerem z załącznikami (umowa MRG Polska–Ukraina, DU/2009/858: 608 stron) — kopia przepisów ma teraz własne limity (do 5000 stron, 128 MB) i dłuższy czas pobierania;
          - strony PDF bez warstwy tekstowej (skany) są czytane lokalnym OCR partiami po 20 stron, a tekst jest składany z powrotem w kolejności stron; w MRG Polska–Ukraina tekst ma tylko strona 1 i 608, strony 2–607 to skany;
          - tekst z OCR jest oznaczony: modele widzą „tekst odczytany OCR ze skanu ELI, możliwe błędy odczytu”, a weryfikacja przepisu z takiej kopii nie daje statusu „zweryfikowany” (cytat trzeba sprawdzić w PDF ELI);
          - Konwencja wiedeńska o stosunkach dyplomatycznych (DU/1965/232): ELI udostępnia tylko pierwszą stronę numeru Dz.U. 1965 nr 37 z adnotacją „Tekst konwencji zamieszczony jest w załączniku do niniejszego numeru”; załącznika nie ma w ELI, więc tekstu konwencji nie da się pobrać z ELI żadną techniką — zamiast „OCR is intentionally disabled” widać tę przyczynę, a pobranie jest ponawiane raz na dobę, nie co godzinę;
          - PDF Dz.U. z lat ok. 2003–2011 mają czcionki z własnym kodowaniem („mi´dzy Rzàdem ma∏ego”) — tekst jest naprawiany do polskich znaków, więc cytaty z takich aktów dają się porównać;
          - umowy międzynarodowe dzielą się na jednostki po „Artykuł N” (dotąd tylko „Art. N.”), a nagłówki stron Dz.U. („Dziennik Ustaw Nr 103 — 7711 — Poz. 858”) nie przerywają tekstu artykułów.

          ### Z hotfix 29: KIO: wyszukiwanie orzeczeń Krajowej Izby Odwoławczej
          - nowy konektor „KIO — orzeczenia Krajowej Izby Odwoławczej (wyszukiwarka UZP)” w Ustawieniach → Konektory (instalacja jednym przyciskiem; w nowych instalacjach włączony od razu) i w karcie Wyszukiwanie;
          - wyszukiwanie po słowach z odmianą w treści, sygnaturze i dacie wydania, z wyborem organu: KIO, sądy okręgowe (skargi na orzeczenia KIO), sądy apelacyjne, SN;
          - „Sprawdź sygnaturę KIO” (dokładne dopasowanie, także w sprawach łączonych); brak trafienia to OUT_OF_SCOPE, nie dowód braku orzeczenia;
          - „Pokaż treść”: metryka (sposób rozstrzygnięcia, przewodniczący, zamawiający, tryb, kluczowe przepisy Pzp, zagadnienia) i treść orzeczenia; „Podgląd źródła” pokazuje treść z wyszukiwarki UZP;
          - modele mogą korzystać z KIO przez narzędzia federacji (orzeczenie KIO to materiał orzeczniczy, przepisy Pzp nadal weryfikowane w ELI).

          ### Z hotfix 29: Wyszukiwanie: wolne źródła (SAOS)
          - SAOS bywa wolny i ponawia zapytanie do 3 razy po 45 s, a aplikacja przerywała czekanie po 110–120 s — wolna odpowiedź kończyła się błędem jako „niedostępne”; teraz czeka do 5 minut;
          - przy dłuższym oczekiwaniu widać licznik sekund i informację, że źródło odpowiada wolno.

          ### Z hotfix 29: Ustawienia → Użytkownicy: przypisania i sprawy
          - „Przypisz osobę do sprawy”: osoba, sprawa, rola i zgoda na deanonimizację w jednym wierszu; przypisanie osoby, która ma już dostęp, zmienia jej rolę;
          - przy każdej sprawie ikona zmiany nazwy i przycisk „Archiwizuj” / „Przywróć”;
          - przypisywać, zmieniać nazwę i archiwizować może właściciel sprawy (tylko on ma klucz sprawy); pozostałe sprawy są widoczne do wglądu.

          ### Z hotfix 29: Gemini przez konto Google: czytelny komunikat
          - Google nie obsługuje już Gemini CLI w bezpłatnym planie konta („Gemini Code Assist for individuals”: IneligibleTierError UNSUPPORTED_CLIENT); zamiast śladu błędu klienta aplikacja pokazuje, że ponowne logowanie nie pomoże, i wskazuje „Google Gemini · API” z kluczem z Google AI Studio;
          - opcja nazywa się teraz „Gemini · konto Google (plan płatny)”.

          ### Z hotfix 28: Wyszukiwanie, podgląd źródła i poprawki konektorów
          - ISAP/ELI: „Podgląd źródła” kończył się SOURCE_PREVIEW_TOO_MANY_REDIRECTS — strona ISAP jest chroniona przed automatami (Imperva); podgląd pokazuje teraz tekst aktu z Sejm ELI (HTML albo PDF tekstu jednolitego); dodane „Pokaż treść” (isap_tekst);
          - EUR-Lex: strony EUR-Lex odpowiadają programom wyzwaniem AWS WAF zamiast treścią; podgląd pokazuje polski tekst aktu lub orzeczenia z repozytorium Urzędu Publikacji UE (Cellar) po numerze CELEX;
          - CBOSA: przy podglądzie źródła usunięto „Pokaż treść”; poprawiony błąd „Zmiana/niekompletność kontraktu HTML CBOSA …: brak pól Data orzeczenia” — data orzeczenia jest na stronie w tabeli zagnieżdżonej razem z informacją o prawomocności i parser ją gubił (dotyczyło też weryfikacji sygnatur przez modele); wynik podaje też prawomocność wg CBOSA;
          - KRS: nowe wyszukiwanie po NIP albo REGON (numer KRS z wykazu podatników VAT, potem odpis aktualny; podmiot spoza wykazu VAT — po numerze KRS); „Podgląd źródła” pokazuje cały odpis aktualny ze wszystkimi działami z Otwartego API KRS (PESEL w treści wolnej zamaskowany); „Otwórz w źródle” prowadzi do wyszukiwarki KRS zamiast pustej strony prs.ms.gov.pl;
          - biała lista VAT: „Podgląd źródła” pokazuje rekord z oficjalnego API (bez ponownego zapytania, API ma dzienny limit); „Otwórz w źródle” prowadzi do wyszukiwarki Ministerstwa Finansów zamiast serwisu podatnik.info;
          - CEIDG: dłuższy czas oczekiwania na API (45 s, jedno ponowienie przy przekroczeniu czasu, nigdy przy limicie zapytań) i podgląd rekordu z API;
          - kursy NBP: oprócz kursu średniego (tabela A) kurs kupna i sprzedaży (tabela C, dla walut, które NBP w niej publikuje); „Podgląd źródła” to tabela kursów z API NBP, „Otwórz w źródle” — strona tabel NBP zamiast surowego XML;
          - SUDOP: zlecenie przyjęte do kolejki nie jest już „Błędem źródła”; aplikacja sama odbiera wynik (do 6 prób, z widocznym postępem) i daje przycisk ponownego odbioru;
          - czas wywołania konektora wydłużony do 110 s (wcześniej 60 s).

          ### Z hotfix 27: Gemini i Grok przez konto, pobieranie klienta działa
          - pobieranie klienta kończyło się „brak wymaganego programu”: '"C:\Users\…\Lex Machina\runtime\node\npm.cmd"' is not recognized; runtime przekazywał do cmd.exe polecenie z cudzysłowami zamienionymi na \" (domyślne cytowanie Node), więc cmd.exe nie rozpoznawał ścieżki; ten sam błąd dotyczył uruchamiania pobranych klientów Gemini CLI i Grok (pliki .cmd);
          - polecenie trafia do cmd.exe dosłownie, a npm jest uruchamiany bezpośrednio przez Node z pakietu aplikacji (bez cmd.exe);
          - przed publikacją CI sprawdza na Windows: npm.cmd i pliki .cmd w katalogu ze spacją, instalację paczki przez npm.cmd i przez Node;
          - korekta diagnozy z hotfix 22 (brak Node w PATH): ta zmiana była potrzebna, ale nie była przyczyną błędu.

          ### Z hotfix 26: Przepisy (RAG), modele wiedzą o dodanych aktach i stanie kopii
          - lista aktów w instrukcji dla modeli i w narzędziu list_core_law_acts pokazuje akty dodane przez użytkowników (oznaczone „dodany przez użytkownika”, z krótką nazwą, np. „Ustawa o podatku akcyzowym”) oraz akty, których kopia nie jest aktualnym brzmieniem (nowszy t.j. albo nowelizacje w ELI); przepisy takich aktów model ma potwierdzać w ELI;
          - modele lokalne (Bielik, Mistral) zawsze widzą akty dodane przez użytkowników; wcześniej dostawały tylko akty z dziedzin aktywnych skilli;
          - poprawka: kopia przepisów była sprawdzana w ELI tylko przy uruchomieniu aplikacji, mimo opisu „sprawdzenie raz dziennie”; teraz w działającej aplikacji każdy tekst jednolity jest sprawdzany raz na dobę, a niepobrane teksty są ponawiane.

          ### Z hotfix 25: Przepisy (RAG), własne akty prawne z ISAP, sprawdzane w Sejm ELI
          - w sekcji „Przepisy (RAG)” administrator może dodać akt prawny spoza map: adres z ISAP (np. https://isap.sejm.gov.pl/isap.nsf/DocDetails.xsp?id=WDU20250000383 albo samo WDU20250000383), ELI (DU/2025/383, adres eli.gov.pl lub api.sejm.gov.pl) albo „Dz.U. 2025 poz. 383” / „M.P. 2024 poz. 12”;
          - „Sprawdź w ELI” pokazuje, co zostanie dodane: tytuł, rodzaj, status, datę ogłoszenia, tekst trafiający do RAG (najnowszy tekst jednolity, także gdy podano starszy t.j. albo sam akt) i liczbę nowelizacji po nim;
          - akt nieistniejący w ELI, nieobowiązujący albo bez tekstu w ELI jest odrzucany z czytelnym komunikatem; akt już obecny w kopii (także pod innym oznaczeniem) nie jest dodawany drugi raz;
          - po dodaniu tekst jest pobierany w tle i od razu sprawdzane są nowelizacje po nim; nowelizacje trafiają do RAG jako osobne dokumenty, a do czasu nowego t.j. przepisy tego aktu są weryfikowane bezpośrednio w ELI;
          - lista „Dodane przez użytkowników” (kto i kiedy dodał, stan, liczba artykułów) z przyciskiem „Usuń z RAG”; dodanie i usunięcie widać w „Ostatnich zmianach w RAG”;
          - poprawka: akt w kopii bez tekstu jednolitego (np. dołączony po weryfikacji) uchodził za aktualny mimo aktów zmieniających; teraz akty zmieniające są nowelizacjami po tekście, a ogłoszony t.j. zastępuje tekst.

          ### Z hotfix 24: Aktualizacje, stan i aktualizacja przepisów (RAG)
