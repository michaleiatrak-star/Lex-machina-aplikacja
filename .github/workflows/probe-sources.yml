name: Probe official sources (one-off)

on:
  push:
    branches:
      - "claude/modest-knuth-re40mu"
    paths:
      - ".github/probes/source-probe.mjs"
      - ".github/workflows/probe-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-pol tesseract-ocr-ukr poppler-utils >/dev/null
      - name: Probe
        run: node .github/probes/source-probe.mjs
