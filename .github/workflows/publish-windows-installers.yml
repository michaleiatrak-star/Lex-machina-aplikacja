name: Publish Windows Installers

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "Wersja rozwojowa rozpakowana/**"
      - "G39-*.md"
      - ".github/workflows/lex-installer.yml"
      - ".github/workflows/offline-windows-installer.yml"
      - ".github/workflows/publish-windows-installers.yml"
      - ".github/workflows/macos-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-installers-${{ github.ref }}
  cancel-in-progress: false

env:
  # "false": the release carries the online installers only (Windows and macOS); the
  # offline Windows installer is neither built nor published. Set to "true" to ship it.
  RELEASE_OFFLINE_INSTALLER: "false"

jobs:
  version:
    name: Release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      released: ${{ steps.read.outputs.released }}
      offline: ${{ steps.read.outputs.offline }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # A skill update pushed to main after the release: validation runs, the installers are not rebuilt.
      - id: read
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .applicationVersion app/installer/windows-release-source.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "offline=$RELEASE_OFFLINE_INSTALLER" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version already published; installers are not rebuilt (bump applicationVersion for a new release)."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  # One release carries Windows and macOS: a separate macOS publish workflow raced this
  # one for the tag (0.1.14 lost its macOS package that way).
  macos:
    needs: version
    if: needs.version.outputs.released != 'true'
    uses: ./.github/workflows/macos-installer.yml
    with:
      asset_name: Lex-Machina-${{ needs.version.outputs.version }}-macOS-arm64-Online.pkg

  runtime:
    uses: ./.github/workflows/lex-runtime.yml
    # Release 0.1.20 only (user's decision): sn.pl search (snproxy) answers HTTP 403
    # since 2026-10-06 (G22 red on PR #27 and PR #28 alike); case-law code unchanged
    # since G22 last passed on main (087ed3d). PR checks keep G22 blocking. Remove
    # after sn.pl recovers.
    with:
      sn_live_advisory: true
    secrets: inherit

  structural_audit:
    uses: ./.github/workflows/f138-structural-audit.yml
    secrets: inherit

  online:
    needs: version
    if: needs.version.outputs.released != 'true'
    uses: ./.github/workflows/lex-installer.yml
    secrets: inherit

  offline:
    needs: version
    if: needs.version.outputs.released != 'true' && needs.version.outputs.offline == 'true'
    uses: ./.github/workflows/offline-windows-installer.yml
    secrets: inherit

  publish:
    name: Publish accepted Windows installers
    needs:
      - version
      - runtime
      - structural_audit
      - online
      - offline
      - macos
    # A skipped offline build (RELEASE_OFFLINE_INSTALLER) does not hold the release back;
    # every other job must have passed.
    if: >-
      ${{ !cancelled() &&
          needs.version.outputs.released != 'true' &&
          needs.runtime.result == 'success' &&
          needs.structural_audit.result == 'success' &&
          needs.online.result == 'success' &&
          needs.macos.result == 'success' &&
          (needs.offline.result == 'success' ||
           (needs.offline.result == 'skipped' && needs.version.outputs.offline != 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OFFLINE: ${{ needs.version.outputs.offline }}

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import json
          with open("app/installer/windows-release-source.json", encoding="utf-8") as f:
              value = json.load(f)["applicationVersion"]
          print(value)
          PY
          )"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "RELEASE_VERSION_INVALID:$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download accepted online installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LexMachina-Windows-Online-Installer
          path: release-input/online

      - name: Download accepted offline installer
        if: needs.version.outputs.offline == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LexMachina-Windows-Offline-Setup
          path: release-input/offline

      - name: Download accepted macOS installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LexMachina-macOS-Online-Installer
          path: release-input/macos

      - name: Verify acceptance receipts and normalize asset names
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          out="release-assets"
          mkdir -p "$out"

          online_receipt="$(find release-input/online -type f -name SHA256.txt -print -quit)"
          online_exe="$(find release-input/online -type f -iname '*.exe' -print -quit)"
          required_files=("$online_receipt" "$online_exe")
          if [[ "$OFFLINE" == "true" ]]; then
            offline_receipt="$(find release-input/offline -type f -name SHA256-OFFLINE.txt -print -quit)"
            offline_exe="$(find release-input/offline -type f -name 'LexMachina-Offline-Setup.exe' -print -quit)"
            required_files+=("$offline_receipt" "$offline_exe")
          fi

          for required in "${required_files[@]}"; do
            if [[ -z "$required" || ! -f "$required" ]]; then
              echo "RELEASE_ACCEPTED_ASSET_MISSING:$required" >&2
              exit 1
            fi
          done

          expected_online="$(grep -E '^sha256=' "$online_receipt" | head -n1 | cut -d= -f2 | tr -d '\r[:space:]')"
          actual_online="$(sha256sum "$online_exe" | awk '{print $1}')"
          if [[ "$expected_online" != "$actual_online" ]]; then
            echo "RELEASE_ONLINE_HASH_MISMATCH expected=$expected_online actual=$actual_online" >&2
            exit 1
          fi

          online_name="Lex-Machina-${version}-Online-x64-Setup.exe"
          cp "$online_exe" "$out/$online_name"
          cp "$online_receipt" "$out/SHA256-ONLINE.txt"
          cp "app/installer/windows-release-source.json" "$out/windows-release-source.json"
          summed=("$online_name")

          offline_name=""
          if [[ "$OFFLINE" == "true" ]]; then
            expected_offline="$(grep -E '^sha256=' "$offline_receipt" | head -n1 | cut -d= -f2 | tr -d '\r[:space:]')"
            actual_offline="$(sha256sum "$offline_exe" | awk '{print $1}')"
            if [[ "$expected_offline" != "$actual_offline" ]]; then
              echo "RELEASE_OFFLINE_HASH_MISMATCH expected=$expected_offline actual=$actual_offline" >&2
              exit 1
            fi
            offline_name="Lex-Machina-${version}-Offline-x64-Setup.exe"
            cp "$offline_exe" "$out/$offline_name"
            cp "$offline_receipt" "$out/SHA256-OFFLINE.txt"
            summed+=("$offline_name")
          fi

          mac_name="Lex-Machina-${version}-macOS-arm64-Online.pkg"
          mac_pkg="release-input/macos/$mac_name"
          mac_expected="$(awk -F= '$1=="sha256"{print $2}' release-input/macos/SHA256.txt | tr -d '\r\n ')"
          if [[ ! -f "$mac_pkg" || "$(sha256sum "$mac_pkg" | awk '{print $1}')" != "$mac_expected" ]]; then
            echo "RELEASE_MACOS_HASH_MISMATCH:$mac_name" >&2
            exit 1
          fi
          cp "$mac_pkg" "$out/$mac_name"

          (
            cd "$out"
            sha256sum "${summed[@]}" "$mac_name" "windows-release-source.json" > SHA256SUMS.txt
          )

          echo "online=$online_name" >> "$GITHUB_OUTPUT"
          echo "offline=$offline_name" >> "$GITHUB_OUTPUT"
          echo "macos=$mac_name" >> "$GITHUB_OUTPUT"

      - name: Refuse duplicate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "RELEASE_TAG_ALREADY_EXISTS:$TAG" >&2
            exit 1
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > release-assets/RELEASE-NOTES.md <<'EOF'
          ## Lex Machina installers

          This release contains two accepted Windows installers and the macOS online package:

          - **Online** — small core installer; downloads and verifies missing runtime components during installation.
          - **Offline** — standalone installer with the complete core runtime bundle for a network-blocked installation.
          - **macOS (Apple silicon) online** — `.pkg`; downloads and verifies the runtime components during installation (internet required, about 2 GB).

          ### macOS: first opening of the package

          The macOS package is not signed with an Apple Developer ID. If macOS refuses to open it, open **System Settings → Privacy & Security** and choose **Open Anyway** for the package (or run `xattr -d com.apple.quarantine <file>.pkg`), then open it again. A macOS update is installed by opening the newer `.pkg`; data and settings are kept.

          ### Local AI

          Local AI is intentionally **not** bundled into either installer. After installing Lex Machina, an administrator can explicitly choose a local model in the application. The application downloads only the selected model, verifies its SHA-256, lets the user choose the context profile, and validates that the selected context can actually start on that computer.

          ### Updates

          Skill and application update channels are fail-closed. In-app application update installation remains disabled until a production Authenticode trust root and signing certificate are configured. This does not prevent manual installation of these installers.

          ### Release status

          This release is marked **pre-release** until production Authenticode signing and repository branch-protection administration are completed.

          Verify installer hashes with `SHA256SUMS.txt` before manual distribution.
          EOF
          if [[ "$OFFLINE" != "true" ]]; then
            sed -i \
              -e 's/^This release contains two accepted Windows installers and the macOS online package:$/This release contains the accepted Windows online installer and the macOS online package (no offline installer in this release):/' \
              -e '/^- \*\*Offline\*\*/d' \
              -e 's/not\*\* bundled into either installer/not** bundled into the installers/' \
              release-assets/RELEASE-NOTES.md
          fi

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          offline_receipt=()
          if [[ "$OFFLINE" == "true" ]]; then
            offline_receipt=(release-assets/SHA256-OFFLINE.txt)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "Lex Machina v$VERSION" \
            --notes-file release-assets/RELEASE-NOTES.md \
            --prerelease \
            release-assets/*.exe \
            release-assets/*.pkg \
            release-assets/SHA256-ONLINE.txt \
            "${offline_receipt[@]}" \
            release-assets/SHA256SUMS.txt \
            release-assets/windows-release-source.json

      - name: Publish release receipts as CI artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LexMachina-Windows-${{ steps.version.outputs.version }}-Published-Receipts
          path: |
            release-assets/SHA256-ONLINE.txt
            release-assets/SHA256-OFFLINE.txt
            release-assets/SHA256SUMS.txt
            release-assets/windows-release-source.json
            release-assets/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 30
