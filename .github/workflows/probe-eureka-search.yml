name: Probe EUREKA search parameters
on:
  push:
    branches: [claude/modest-knuth-re40mu]
    paths:
      - ".github/workflows/probe-eureka-search.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - name: Compare search variants
        shell: bash
        run: |
          cat > probe.mjs <<'JS'
          const BASE = "https://eureka.mf.gov.pl/api/public/v1";
          const COLS = ["ID_INFORMACJI", "SYG", "DT_WYD", "TEZA", "KATEGORIA_INFORMACJI", "STATUS_INFORMACJI"];
          const q = "akcyza alkohol";
          async function run(label, body, sort = "DT_WYD%2Cdesc") {
            const url = `${BASE}/wyszukiwarka/informacje/?size=5&page=0${sort ? `&sort=${sort}` : ""}`;
            try {
              const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify(body) });
              const j = await r.json();
              console.log(`\n== ${label} [HTTP ${r.status}] totalHits=${j.totalHits}`);
              for (const x of j.results ?? []) console.log(`  ${String(x.DT_WYD).slice(0, 10)} ${x.TEZA?.slice(0, 110)}`);
            } catch (e) { console.log(`\n== ${label} ERROR ${e}`); }
          }
          const base = { filter: {}, columns: COLS, searchInFullPhrase: false, searchInContent: false, searchInSynonyms: false, warunkiDodatkowe: [] };
          await run("A obecne", { ...base, searchQuery: q });
          await run("B fullPhrase", { ...base, searchInFullPhrase: true, searchQuery: q });
          await run("C content", { ...base, searchInContent: true, searchQuery: q });
          await run("D synonyms", { ...base, searchInSynonyms: true, searchQuery: q });
          await run("E bez sortu", { ...base, searchQuery: q }, "");
          await run("F sort _score", { ...base, searchQuery: q }, "_score%2Cdesc");
          await run("G samo akcyza", { ...base, searchQuery: "akcyza" });
          await run("H bez frazy", { ...base });
          // How the portal itself builds the request.
          try {
            const html = await (await fetch("https://eureka.mf.gov.pl/")).text();
            const scripts = [...html.matchAll(/src="([^"]+\.js)"/g)].map((m) => new URL(m[1], "https://eureka.mf.gov.pl/").toString());
            console.log("\n== portal scripts", scripts);
            for (const s of scripts) {
              const js = await (await fetch(s)).text();
              for (const key of ["searchInFullPhrase", "searchQuery", "wyszukiwarka/informacje", "sort="]) {
                let i = js.indexOf(key), n = 0;
                while (i >= 0 && n < 4) {
                  console.log(`-- ${s.split("/").pop()} ${key}: ${js.slice(Math.max(0, i - 250), i + 250).replace(/\s+/g, " ")}`);
                  i = js.indexOf(key, i + 1); n++;
                }
              }
            }
          } catch (e) { console.log("portal ERROR", e); }
          JS
          node probe.mjs
