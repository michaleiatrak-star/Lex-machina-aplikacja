name: Publish Lex Machina 0.1.12 online installer

# Builds, accepts and publishes the online installer in one run: runtime
# validation, the G33D online installer build and installed-copy acceptance,
# then the exact accepted artifact is attached to a pre-release at GITHUB_SHA.

on:
  push:
    branches:
      - "claude/intelligent-hypatia-0s6bb3"
    paths:
      - ".github/workflows/publish-0.1.12.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: lex-publish-0.1.12
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.12
  RELEASE_TITLE: Lex Machina v0.1.12
  ASSET_NAME: Lex-Machina-0.1.12-Online-x64-Setup.exe

jobs:
  runtime:
    name: Runtime and Gate I audit
    uses: ./.github/workflows/lex-runtime.yml
    # sn.pl search returned an error envelope during the 36-38 runs; SN and
    # CBOSA code is unchanged since hotfix 35 (G22 passed there). Release-only.
    with:
      sn_live_advisory: true
    secrets: inherit

  online:
    name: Accepted online installer
    needs:
      - runtime
    uses: ./.github/workflows/lex-installer.yml
    secrets: inherit

  windows-account-shim:
    name: Windows account client launch (npm.cmd, path with a space)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/lex-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install runtime dependencies
        run: npm install --no-audit --no-fund

      # Each argument must reach the .cmd as one quoted argument.
      - name: npm.cmd and .cmd shims under "Lex Machina"
        run: npm run validate:windows-account-shim

  kio-live:
    name: KIO connector against the live UZP search
    runs-on: windows-latest
    timeout-minutes: 15
    # Official external service: an outage must not block the release, the
    # result is read before handing over the installer.
    continue-on-error: true
    defaults:
      run:
        working-directory: "Wersja rozwojowa rozpakowana/audyt-systemu-v4/mcp-servers"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install connector dependencies
        run: npm ci --no-audit --no-fund

      - name: KIO live cases
        env:
          LEX_TYLKO: "^KIO"
        run: node test_na_zywo.mjs

  publish:
    name: Publish accepted online installer
    needs:
      - runtime
      - online
      - windows-account-shim
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download accepted online installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LexMachina-Windows-Online-Installer
          path: release-input/online

      - name: Verify receipt and assemble release payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-out

          online_exe="$(find release-input/online -type f -iname '*.exe' -print -quit)"
          online_receipt="$(find release-input/online -type f -name 'SHA256.txt' -print -quit)"
          for required in "$online_exe" "$online_receipt"; do
            [[ -n "$required" && -f "$required" ]] || {
              echo "RELEASE_ACCEPTED_ASSET_MISSING:$required" >&2
              exit 1
            }
          done

          expected="$(awk -F= '$1=="sha256"{print $2}' "$online_receipt" | tr -d '\r\n ')"
          actual="$(sha256sum "$online_exe" | awk '{print $1}')"
          [[ "$expected" == "$actual" ]] || {
            echo "ONLINE_RELEASE_HASH_MISMATCH expected=$expected actual=$actual" >&2
            exit 1
          }

          cp "$online_exe" "release-out/$ASSET_NAME"
          cp "$online_receipt" release-out/CI-SHA256-ONLINE.txt
          cp app/lex-version.yaml release-out/LEX-VERSION.yaml
          printf '%s\n' "$GITHUB_SHA" > release-out/SOURCE-SHA.txt
          (
            cd release-out
            sha256sum "$ASSET_NAME" LEX-VERSION.yaml > SHA256SUMS.txt
          )
          cat release-out/SHA256SUMS.txt

      - name: Write release notes
        shell: bash
        run: |
          cat > release-out/RELEASE-NOTES.md <<'EOF'
          ## Lex Machina 0.1.12

          ### Orzeczenia, interpretacje i KIO: pełny tekst z zaznaczonym fragmentem
          - w „Źródła i weryfikacja” (oraz przy źródłach pomocniczych z serwisów orzeczeń) przycisk „Pełny tekst z zaznaczeniem”: cały wyrok, postanowienie, uchwała, orzeczenie KIO albo interpretacja pobrane z oficjalnego źródła (SN, CBOSA NSA/WSA, SAOS, KIO/UZP, EUREKA, UODO, TSUE; także PDF), przywołany fragment zaznaczony, okno otwiera się od razu w tym miejscu;
          - nagłówek podglądu podaje zdanie odpowiedzi, które przypisuje coś temu rozstrzygnięciu, oraz wynik dopasowania: fragment dosłowny, tylko jego początek albo brak dosłownego fragmentu (parafraza lub błąd modelu, zaznaczona sygnatura) z ostrzeżeniem do ręcznej weryfikacji kontekstu;
          - tekst pochodzi wyłącznie ze źródła (lista dozwolonych domen urzędowych), nigdy z modelu; status orzeczeń NSA/WSA pozostaje snapshotem.

          ### Z 0.1.11
          Wydanie zbiorcze: wszystkie zmiany z 0.1.10 hotfix 1–47. Instalator online dla Windows, zbudowany i przetestowany w przebiegu G33D (instalacja i uruchomienie zainstalowanej kopii) w tym samym przebiegu co publikacja. Instalacja na 0.1.10 jest aktualizacją (dane, sprawy i ustawienia zostają). W tym wydaniu nie ma instalatora macOS (ostatni: 0.1.10 hotfix 42).

          ### Najważniejsze od 0.1.10 (z 0.1.11)
          - pamięć sprawy: przepisy zweryfikowane wcześniej (po kontroli w Sejm ELI) i streszczenie starszej części rozmowy zamiast jej pomijania;
          - akta sprawy dostępne dla modelu w całości (narzędzia), kontynuacja uciętych długich odpowiedzi;
          - ścieżka obowiązkowa prawnego routera (bramki z modułów) i tryb LAIK / PRAWNIK ustalany przez aplikację na wejściu;
          - przy ponownym pytaniu w wątku status przepisów z rejestru, „k.k.” = KK, bez fałszywych blokad G8 przy porównaniach przepisów;
          - tabele w czacie, podgląd przepisu z lokalnej kopii z zaznaczeniem, miernik jakości odpowiedzi (także modele przez konto);
          - generator faktur, widgety skilli w czacie, wzory pism bez pseudonimizacji danych przykładowych.

          ### Z 0.1.10 hotfix 47: Poprawka blokady G8 przy porównaniu przepisów
          - odpowiedź z wierszem typu „Art. 233, art. 234 i art. 238 …” (kodeks podany wyżej, w nagłówku lub innym zdaniu) była blokowana (VERIFICATION_MARKER_MISMATCH, MISSING_LEDGER_RECORD), gdy w rejestrze były jednocześnie art. 233 KK i art. 233 § 1 KK; teraz przepis bez skrótu aktu dostaje akt z wiersza, z innego miejsca odpowiedzi, gdzie ten artykuł stoi z aktem, albo jedyny akt odpowiedzi (nigdy, gdy w wierszu jest akt nazwany słowami, np. „ustawy o …”);
          - artykuł i jego paragraf zweryfikowane w tym samym miejscu źródła nie są już traktowane jako niejednoznaczne;
          - „Źródła i weryfikacja”: art. 233 § 1 KK nie jest powtarzany obok art. 233 KK z tego samego miejsca tekstu jednolitego.

          ### Z 0.1.10 hotfix 46: Ścieżka obowiązkowa routera i tryb LAIK / PRAWNIK
          - tryb LAIK albo PRAWNIK ustala aplikacja na wejściu, z treści pytania według tabeli sygnałów KROK 1 (np. „233 kk”, „art. 415 KC”, sygnatura → PRAWNIK; sytuacja życiowa bez terminologii → LAIK); niejednoznaczne pytanie zachowuje tryb sprawy albo model zadaje jedno pytanie a/b;
          - sprawa typowa (PRAWNIK, karna, pismo) ma profil pełny: aplikacja ładuje obowiązkowe bramki prawnego routera (CN-GATE, WYJ-GATE, REM-GATE i inne) z modułów, do których się odwołują; pytania proste i laickie zostają na profilu lekkim;
          - po odpowiedzi rejestr kroków obowiązkowych (router, skill, weryfikacja, bramki twarde) z tym, kto je wykonał (aplikacja / model) i czego brakuje, widoczny pod odpowiedzią i przekazywany do następnej wiadomości; deklaracja „sprawdziłem w SAOS/ISAP” bez wywołania narzędzia jest oznaczana.

          ### Z 0.1.10 hotfix 46: Ponowne pytanie w wątku bez fałszywego „NIEWERYFIKOWANE”
          - „art. 233 k.k.” i „art. 233 KK” to ten sam przepis: przepis zweryfikowany wcześniej w wątku dostaje status z rejestru (po kontroli w Sejm ELI), zamiast ⚠️ [NIEWERYFIKOWANE];
          - przepisy z pytania (także zapis „233 kk”) aplikacja weryfikuje w Sejm ELI przed odpowiedzią;
          - znacznik ⚠️ [NIEWERYFIKOWANE] wpisany przez model przy przepisie nie blokuje już weryfikacji przez aplikację; status nadaje aplikacja (orzeczenia bez zmian);
          - akt zweryfikowany w ELI, którego nie ma w lokalnej kopii albo jest tam w starszym tekście jednolitym, jest automatycznie pobierany do kopii (RAG).

          ### Z 0.1.10 hotfix 46: Wzory i dane przykładowe
          - imiona, nazwiska, adresy i dane kontaktowe z przykładów napisanych wcześniej przez asystenta (wzór pisma) nie są pseudonimizowane przy kolejnej wiadomości, o ile nie występują w wiadomościach użytkownika ani w załączonych dokumentach i historia jest kompletna; identyfikatory (PESEL, NIP, IBAN) są zawsze chronione.

          ### Z 0.1.10 hotfix 45: Tabele w odpowiedziach
          - czat rysuje tabele, nagłówki, listy i pogrubienia z odpowiedzi modelu; wcześniej tabela była widoczna jako surowe znaki | i **;
          - znacznik weryfikacji dopisany przez model za ostatnią kreską wiersza tabeli trafia do ostatniej komórki, zamiast znikać.

          ### Z 0.1.10 hotfix 45: Podgląd przepisu z zaznaczeniem
          - w „Źródła i weryfikacja” przy przepisie przycisk „Podgląd z zaznaczeniem”: artykuł z lokalnej kopii tekstu z Sejm ELI w oknie aplikacji, cytowany paragraf lub ustęp zaznaczony, okno otwiera się od razu w tym miejscu; nagłówek podaje tekst jednolity i datę kopii;
          - gdy przepisu nie ma w lokalnej kopii, podgląd pokazuje oficjalny tekst.

          ### Z 0.1.10 hotfix 45: Miernik jakości w aplikacji (także modele przez konto)
          - Ustawienia → Konserwacja → „Miernik jakości odpowiedzi” (administrator): wybór modelu połączonego w aplikacji (konto ChatGPT, Claude, Gemini, Grok albo klucz API), szybki zestaw (5 spraw, 10 wiadomości) albo pełny (18 spraw), opcjonalnie pomiar streszczenia rozmowy;
          - postęp, przerwanie, tabela pomiarów z porównaniem do poprzedniego pomiaru tego samego modelu, raport do pobrania; sprawy testowe są po pomiarze archiwizowane;
          - każda wiadomość pomiaru liczy się do limitu konta lub kosztu klucza API.

          ### Z 0.1.10 hotfix 44: Pamięć sprawy: przepisy ustalone wcześniej
          - po każdej odpowiedzi w sprawie aplikacja zapisuje (zaszyfrowane, w sprawie) przepisy zweryfikowane względem aktualnego tekstu jednolitego, inne użyte źródła i przeczytane skille;
          - przy kolejnej wiadomości (modele w chmurze) każdy taki akt jest raz sprawdzany w Sejm ELI: przepis jest użyty bez ponownej weryfikacji tylko wtedy, gdy ELI ma ten sam tekst jednolity i nie ma nowelizacji po nim; w przeciwnym razie trafia do ponownej weryfikacji; brzmienie przepisu model nadal bierze wyłącznie z narzędzia;
          - efekt: mniej rund i zapytań w długich rozmowach o tej samej sprawie, spójne statusy przepisów między wiadomościami.

          ### Z 0.1.10 hotfix 44: Pamięć sprawy: streszczenie zamiast pomijania starszych wiadomości
          - gdy rozmowa nie mieści się w oknie modelu, najstarsze wiadomości zastępuje streszczenie (fakty, stanowiska stron, ustalenia prawne, dokumenty i dowody, otwarte kwestie) zamiast informacji „wcześniejsza część rozmowy pominięta”;
          - streszczenie tworzy model z tekstu spseudonimizowanego, bez narzędzi; przepisy w streszczeniu mają status wyłącznie z rejestru weryfikacji (inne są oznaczone jako niezweryfikowane);
          - karta „Pamięć sprawy” w czacie sprawy: podgląd i poprawka streszczenia (poprawka jest zachowywana przy kolejnych aktualizacjach), lista przepisów ustalonych wcześniej, „Wyczyść pamięć sprawy”.

          ### Z 0.1.10 hotfix 44: Miernik jakości odpowiedzi
          - zestaw 18 zanonimizowanych pytań z 16 dziedzin (6 rozmów wielowiadomościowych) uruchamiany na działającej aplikacji z weryfikacją w Sejm ELI: blokady, odsetek przepisów zweryfikowanych, kompletność, ciągłość w wątku, czas i tokeny, porównanie z poprzednim pomiarem;
          - odpowiedź z kluczem API podaje zużycie tokenów całej tury.

          ### Z 0.1.10 hotfix 43: Akta sprawy dostępne dla modelu w całości
          - przy zaznaczonym „Przeszukuj dokumenty bieżącej sprawy” model w chmurze może sam przejrzeć spis dokumentów sprawy, przeszukać wszystkie fragmenty akt i przeczytać całe wskazane fragmenty; wcześniej dostawał tylko kilka fragmentów dobranych do pytania i przyciętych do okna modelu;
          - tekst trafia do modelu spseudonimizowany, tak jak jest zapisany w aktach; odczytane fragmenty można cytować w odpowiedzi (klikany odnośnik do strony), a symbole osób wracają w odpowiedzi do nazwisk;
          - limit odczytu na jedną odpowiedź: do 120 tys. znaków (najwyżej 30% okna modelu); modele lokalne (Bielik, Mistral) nie dostają tych narzędzi.

          ### Z 0.1.10 hotfix 43: Poprawka: nazwisko innej osoby w odpowiedzi
          - przy dokumentach na wspólnym kluczu sprawy obok dokumentów z własnym kluczem symbol osoby w odpowiedzi ([LMPII:D01:…]) mógł zostać zamieniony na nazwisko z niewłaściwego dokumentu; numeracja dokumentów przy przywracaniu jest teraz ta sama co przy pseudonimizacji.

          ### Z 0.1.10 hotfix 43: Długie odpowiedzi (klucze API)
          - odpowiedź ucięta na limicie długości modelu (16 384 tokenów) jest automatycznie kontynuowana od miejsca przerwania (do 3 razy); jeśli nadal się nie mieści, kończy się widoczną adnotacją „ODPOWIEDŹ UCIĘTA”; wcześniej ucięta odpowiedź wyglądała na kompletną;
          - gdy model wyczerpie limit 10 kroków narzędzi, dostaje jeszcze jedno polecenie odpowiedzi z wyników, które już zebrał (bez kolejnych wywołań; czego nie zweryfikował, oznacza jako niezweryfikowane); wcześniej zostawał sam wstęp odpowiedzi.

          ### Z 0.1.10 hotfix 43: Przepisy i bramki
          - przy awarii Sejm ELI, gdy kopia ELI nie potwierdza przepisu: źródła zastępcze według kanonu E-3/E-4 (RZĄD 2A — VER ze źródłem i datą; dwa zgodne portale RZĘDU 2B ze znacznikiem t.j. zgodnym z indeksem ELI — KOTWICA-URZĘDOWA i TREŚĆ; w pozostałych przypadkach NIEWERYFIKOWANE; RZĄD 3 odrzucany);
          - przepis zweryfikowany w tej turze i powtórzony bez znacznika (np. w tabeli porównania art. 233, 234 i 238 k.k.) dostaje znacznik z rejestru zamiast blokować całą odpowiedź; znacznik VER dopisany przez model, niezgodny z rejestrem, jest zastępowany znacznikiem z rejestru; zmieniony znacznik przy orzeczeniu nadal blokuje (G22); komunikat blokady pokazuje zablokowane odwołania;
          - wybór workflow (np. chronologii) liczy się z ostatniej wiadomości użytkownika, a nie z całej rozmowy z odpowiedziami asystenta;
          - tryb AUTO z wyborem skilli przez model zapisuje w audycie route i etapy G39H (wcześniej audit.missing i blokada G39I);
          - kopia przepisów (RAG): wyszukiwanie po ustępach długich artykułów (pokazywany jest trafiony ustęp); artykuły z PDF z lukami w numeracji lub zdublowanym nagłówkiem są oznaczane jako podejrzane i weryfikowane w ELI.

          ### Z 0.1.10 hotfix 43: Faktury: generator
          - autonumeracja według wzoru z tokenami {NR}, {DD}, {MM}, {RRRR}, {RR}, licznik od nowa co miesiąc, co rok albo nigdy; puste pole numeru dostaje kolejny numer (Ustawienia → Faktury i KSeF → Autonumeracja);
          - opust w pozycji faktury; oznaczenia: metoda kasowa, samofakturowanie, odwrotne obciążenie, mechanizm podzielonej płatności; przy stawce „zw” wymagana podstawa zwolnienia;
          - lista elementów faktury z art. 106e ust. 1 ustawy o VAT porównywana z brzmieniem pobranym na żywo z ELI (rozbieżności i punkty nieobsługiwane są zgłaszane).

          ### Z 0.1.10 hotfix 42: Widgety skilli w czacie
          - skille, które pokazują interaktywny widget (np. „wczytaj widget audyt systemu” — menu wyboru elementów audytu z audyt-systemu-v4), działają w aplikacji: model wywołuje narzędzie show_widget, a widget pojawia się pod odpowiedzią; wcześniej model odpowiadał, że nie może wczytać widgetu;
          - widget działa w izolowanej ramce bez dostępu do internetu, danych aplikacji i sesji użytkownika; przycisk w widgecie, który wysyła polecenie (np. „Uruchom audyt”), wysyła je jako Twoją wiadomość w czacie; eksport z widgetu (JSON, MD, CSV) zapisuje plik w folderze Pobrane;
          - widget zostaje w wątku sprawy po ponownym otwarciu; przyciski „Odśwież” i „Zwiń”; modele lokalne (Bielik, Mistral) nie dostają tego narzędzia.

          ### Z 0.1.10 hotfix 42: Faktury: wzory do wielokrotnego użytku
          - w edytorze faktury „Zapisz jako wzór…”: wzór zapisuje nabywcę, pozycje, sposób płatności z terminem w dniach, walutę, miejsce wystawienia i uwagi (bez numeru i dat); zapis pod istniejącą nazwą aktualizuje wzór;
          - na liście faktur sekcja „Wzory faktur”: „Nowa ze wzoru” (dzisiejsze daty, termin liczony od dziś, sprzedawca z ustawień) i „Usuń wzór”.

          ### Z 0.1.10 hotfix 42: ChatGPT/Codex przez konto: „Unexpected non-whitespace character after JSON”
          - model proszony o wszystkie odczyty i weryfikacje w jednej rundzie zapisywał czasem kilka bloków wywołań narzędzi albo tekst po nich, a aplikacja przerywała wykonanie (PROVIDER_UNCODED_FAILURE); teraz wywołania ze wszystkich bloków są łączone, a instrukcja dla modelu wymaga jednego bloku.

          ### Z 0.1.10 hotfix 41: Faktury: dane kontrahenta po NIP
          - przy polu NIP (sprzedawca, nabywca, dane sprzedawcy w ustawieniach) przycisk „Pobierz dane”: nazwa i adres z białej listy VAT (Ministerstwo Finansów, bez klucza), a gdy podmiotu tam nie ma — z CEIDG (wymaga klucza w Ustawieniach → Konektory MCP); po wpisaniu poprawnego NIP przy pustej nazwie i adresie dane pobierają się same;
          - ostrzeżenie przy statusie VAT innym niż „Czynny” (albo CEIDG innym niż „AKTYWNY”); odpowiedź z innym NIP jest odrzucana; widać źródło i identyfikator zapytania z wykazu VAT;
          - jedyny rachunek sprzedawcy z wykazu VAT trafia do pustego pola rachunku przy przelewie.

          ### Z 0.1.10 hotfix 41: Faktury: płatność i stawka VAT
          - sposób płatności z listy: przelew, gotówka, zapłacono (na fakturze adnotacja „Zapłacono”);
          - przy przelewie termin 7, 14, 21 albo 30 dni od daty wystawienia albo własna data; zmiana daty wystawienia przesuwa termin;
          - stawka VAT z listy: 23%, 8%, 5%, 0%, zw, np, oo;
          - Ustawienia → Faktury i KSeF → „Domyślne na nowej fakturze”: sposób płatności, termin przelewu i stawka VAT (ustawienie fabryczne: przelew, 14 dni, 23%); przycisk „Sprawdź stawkę w ELI” pokazuje fragmenty aktualnego tekstu ustawy o VAT z Sejm ELI.

          ### Z 0.1.10 hotfix 40: Dziennik nieprawidłowości na desktopie
          - sekcja Ustawienia → Konserwacja → Dziennik nieprawidłowości działa na desktopie; wcześniej kończyła się kodem DESKTOP_ROUTE_NOT_ALLOWED i jednocześnie pokazywała „0 błędów” i „Brak nieprawidłowości”;
          - gdy dziennika nie da się wczytać, sekcja pokazuje „dziennik niedostępny” z kodem błędu zamiast pustego dziennika;
          - CI sprawdza, że każda trasa runtime ma wpis w allowliście proxy desktopu.

          ### Z 0.1.10 hotfix 40: Przepisy
          - końcowy walidator spójności statusów przepisów w odpowiedzi; linki ELI z kotwicą do jednostki redakcyjnej;
